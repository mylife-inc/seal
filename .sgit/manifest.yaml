- cli/legacy-ui-attempt
- cli/src
- cli/tests
- docs/internal
- docs/specs
- docs/superpowers
- infra
- portal
gitignore:
  managed_block: true
hooks:
  install: true
railway:
  generate_files: true
  build_command: sgit run-secure -- docker build -t app .
dispatch:
  workflow: .github/workflows/codeseal-portal-dispatch.yml
  default_ref: main
  public_key: age1lhpqc6q57vtum2uy0p0e7sx89m4qrfpgupe99l605lcmsx05fyhqvnd4zj
  auto_on_push:
    enabled: true
    branches:
    - main
  runner_key_file: ci-runner.key
  targets:
    cli:
      workflow: release.yml
      inputs:
        version: prompt
    docs:
      workflow: docs.yml
      token: false
    image:
      workflow: portal-image.yml
      inputs:
        version: prompt
codeseal_config:
  alias: seal
