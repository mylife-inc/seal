# compose.standalone.yml — run the CodeSeal Portal WITHOUT cloning
# the source repository.
#
# Unlike compose.yml (which `build:`s every image from the source
# tree), this file PULLS pre-built images from GHCR. Use it when you
# only want to operate a Portal — no Rust toolchain, no Node, no
# source checkout.
#
# Quick start (any empty directory):
#
#   # 1. Download this file:
#   curl -fsSLO https://raw.githubusercontent.com/mylife-inc/CodeSeal/main/compose.standalone.yml
#
#   # 2. Create the .env with random secrets (URL-safe — hex only):
#   cat > .env <<EOF
#   POSTGRES_PASSWORD=$(openssl rand -hex 32)
#   REDIS_PASSWORD=$(openssl rand -hex 32)
#   SESSION_SECRET=$(openssl rand -hex 64)
#   ENCRYPTION_PEPPER=$(openssl rand -hex 64)
#   CODESEAL_WORKER_SECRET=$(openssl rand -hex 32)
#   INVITATION_TOKEN_SECRET=$(openssl rand -hex 32)
#   BOOTSTRAP_ADMIN_EMAIL=admin@example.com
#   BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 16)
#   EOF
#   grep BOOTSTRAP_ADMIN_PASSWORD .env   # ← note it down, you'll log in with it
#
#   # 3. Up:
#   docker compose -f compose.standalone.yml up -d
#
#   # 4. Open http://localhost:3000 and log in with the bootstrap admin.
#   #    Then REMOVE the BOOTSTRAP_* lines from .env (the account exists now).
#
# Image tags: `latest` tracks the newest stable release. Pin a version
# (e.g. :v1.0.0) for production — set CODESEAL_VERSION in .env.
#
# What this file does NOT include (vs. the in-repo compose.yml):
#   - The `env-check` pre-flight (it bind-mounts a script from the
#     source tree). Generate passwords with `openssl rand -hex` as
#     shown above and you're safe from the URL-unsafe-character trap.

services:
  # One-shot schema migrator — runs `prisma migrate deploy` and exits.
  # Uses the dedicated migrate image (the portal's builder stage, which
  # carries the Prisma CLI; the slim runtime image doesn't).
  portal-migrate:
    image: ghcr.io/mylife-inc/codeseal-portal-migrate:${CODESEAL_VERSION:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://codeseal:${POSTGRES_PASSWORD}@postgres:5432/codeseal
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    networks:
      - codeseal
    restart: "no"

  portal:
    image: ghcr.io/mylife-inc/codeseal-portal:${CODESEAL_VERSION:-latest}
    env_file:
      - .env
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://codeseal:${POSTGRES_PASSWORD}@postgres:5432/codeseal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_PEPPER: ${ENCRYPTION_PEPPER}
      CODESEAL_PUBLIC_URL: ${CODESEAL_PUBLIC_URL:-http://localhost:3000}
      SGIT_BINARY_PATH: /usr/local/bin/sgit
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      OPEN_SIGN_UP: ${OPEN_SIGN_UP:-false}
      INVITATION_TOKEN_SECRET: ${INVITATION_TOKEN_SECRET}
      DEFAULT_INVITATION_TTL_HOURS: ${DEFAULT_INVITATION_TTL_HOURS:-168}
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    networks:
      - codeseal
    restart: unless-stopped

  worker:
    image: ghcr.io/mylife-inc/codeseal-worker:${CODESEAL_VERSION:-latest}
    env_file:
      - .env
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://codeseal:${POSTGRES_PASSWORD}@postgres:5432/codeseal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CODESEAL_WORKER_SECRET: ${CODESEAL_WORKER_SECRET}
      SGIT_BINARY_PATH: /usr/local/bin/sgit
      WORK_DIR: /work
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - worker_work:/work
    networks:
      - codeseal
    restart: unless-stopped

  postgres:
    # Stock postgres (vs. the repo's hardened codeseal/postgres image,
    # which needs a source build). Fine for evaluation; for production
    # use a managed Postgres or build the hardened image from source.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeseal
      POSTGRES_USER: codeseal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codeseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U codeseal -d codeseal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    # Stock redis with auth + persistence disabled (Redis is ephemeral
    # state for CodeSeal: sessions, queues, unlocked-key cache with TTL).
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --appendonly
      - "no"
    tmpfs:
      - /data
    networks:
      - codeseal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  worker_work:

networks:
  codeseal:
    driver: bridge
