# Publish the `sgit` binaries from the sealed repository.
#
# `workflow_dispatch` only. `cli/src` is encrypted, so a runner cannot build
# anything until it holds a dispatch token — and only a key-holder can mint
# one. Start it with `sgit ci dispatch cli`.
#
# The release is created in *this* repository rather than a shared artefact
# bucket, which means the built-in GITHUB_TOKEN is enough: no PAT, nothing to
# rotate, and the repository publishes what it built rather than borrowing
# somebody else's namespace.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.2.0"
        required: true
        type: string
      encrypted_token:
        description: "age-encrypted dispatch payload (base64)"
        required: true
        type: string
      build_id:
        description: "UUID from the dispatcher, for audit correlation"
        required: false
        type: string

permissions:
  contents: read

jobs:
  binaries:
    name: sgit (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    # Every host the installer resolves to.
    #
    # It picks by the *host's* architecture, not by what is being built, so a
    # release missing one of these fails on whichever machine asks for it —
    # which is exactly how three of four jobs 404'd the first time Zellij tried
    # this. `macos-latest` is Apple Silicon, so the Intel Darwin build has to be
    # a cross-compile from it rather than a native build on an Intel runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, platform: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, platform: macos-latest }
          - { target: x86_64-apple-darwin, platform: macos-latest }
          # Windows, cross-compiled from Linux — and it has to be.
          #
          # A `windows-latest` runner would need to decrypt before it could
          # build, decryption needs `sgit`, and there is no Windows `sgit` to
          # install: the binary this job produces is the one that would be
          # required to produce it. Cross-compiling from a Linux runner, which
          # *can* decrypt, breaks the circle.
          #
          # `-gnu` rather than `-msvc` for the same reason — the MSVC toolchain
          # only exists on Windows.
          - { target: x86_64-pc-windows-gnu, platform: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      # `cli/` is ciphertext until this runs. The action destroys the key
      # material before it returns, so cargo never sees it.
      - uses: ./.github/actions/codeseal-decrypt
        with:
          encrypted_token: ${{ inputs.encrypted_token }}
          dispatch_key: ${{ secrets.CODESEAL_DISPATCH_PRIVATE_KEY }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl needs a linker that the Ubuntu images do not carry by default.
      - name: Install the musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install the mingw toolchain
        if: contains(matrix.target, 'windows')
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: release-${{ matrix.target }}

      # The version being published has to be the version being built.
      #
      # Zellij shipped `zel-v0.1.2-*.tar.gz` containing a binary that answered
      # `0.1.0`, because the workflow took its version from a dispatch input and
      # nothing ever read Cargo.toml. Every part of that release agreed with
      # every other part and all of them were wrong together.
      - name: The manifest agrees with the version being published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared=$(awk '/^\[package\]/{p=1} p&&/^version *=/{gsub(/[" ]/,"",$3); print $3; exit}' cli/Cargo.toml)
          want="${VERSION#v}"
          [ "$declared" = "$want" ] || {
            echo "::error::cli/Cargo.toml declares $declared, but this would publish $want."
            echo "::error::Bump the version and commit it, then dispatch again."
            exit 1
          }
          echo "cli/Cargo.toml declares $declared"

          # And the lockfile, which `--locked` checks a step later with a
          # message about lock files rather than about versions.
          #
          # `cargo build --locked` refuses to update Cargo.lock, so a bumped
          # Cargo.toml with a stale lock fails all five matrix jobs with
          # "cannot update the lock file ... because --locked was passed" —
          # true, unhelpful, and three releases in a row now. The bump belongs
          # in the same commit as the lock it implies.
          locked=$(awk '/^name = "sgit"$/{f=1;next} f&&/^version = /{gsub(/[" ]/,"",$3); print $3; exit}' cli/Cargo.lock)
          [ "$locked" = "$want" ] || {
            echo "::error::cli/Cargo.lock pins $locked, but cli/Cargo.toml declares $want."
            echo "::error::Run a build locally so cargo rewrites the lock, and commit it."
            exit 1
          }
          echo "cli/Cargo.lock pins $locked"

      - name: Build
        working-directory: cli
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sgit-${VERSION}-${TARGET}"

          # Windows gets a .zip holding sgit.exe. `install.sh` is POSIX and
          # cannot run there, so this archive is downloaded and unpacked by
          # hand — a format Explorer opens without extra software is worth
          # more than consistency with the tarballs.
          case "$TARGET" in
            *windows*)
              ( cd "cli/target/${TARGET}/release" && zip -q "$OLDPWD/dist/${name}.zip" sgit.exe )
              ( cd dist && shasum -a 256 "${name}.zip" > "${name}.zip.sha256" )
              ;;
            *)
              tar -czf "dist/${name}.tar.gz" -C "cli/target/${TARGET}/release" sgit
              ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish the release
    needs: binaries
    runs-on: ubuntu-latest

    # The only job that writes, and the only one that needs to. It builds
    # nothing, so it never decrypts.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      # The installer has to look where this workflow publishes.
      #
      # It did not. `DEFAULT_REPO` still named the shared artefact bucket the
      # binaries went to while the source was private, so `curl … | sh` kept
      # installing v1.1.0 long after v1.3.0 was published — and reported
      # success, because from where it was looking that WAS the latest release.
      # Nothing failed. The only way to see it was to install and run
      # `sgit --version`.
      - name: The installer looks where this release lands
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^DEFAULT_REPO="\(.*\)"$/\1/p' scripts/install.sh | head -1)
          [ "$declared" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::scripts/install.sh installs from $declared, but this publishes to $GITHUB_REPOSITORY."
            echo "::error::A release nobody can install is worse than no release. Fix DEFAULT_REPO."
            exit 1
          }
          echo "install.sh reads $declared"

      - name: Checksums, and the installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # One SHA256SUMS over every archive, beside the per-archive files.
          # The installer reads either, and has failed closed on a release that
          # published only the form it was not looking for.
          ( cd dist && shasum -a 256 ./*.tar.gz ./*.zip > SHA256SUMS && shasum -a 256 -c SHA256SUMS )
          # Published with the binaries, so a pinned version can always be
          # installed the same way the release it belongs to was.
          cp scripts/install.sh dist/install.sh
          ls -1 dist | sed 's/^/  /'

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A version with a dash is a pre-release; the installer skips those
          # when resolving "latest", so a candidate cannot be installed by
          # accident.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac

          gh release create "codeseal-${VERSION}" \
            --title "CodeSeal ${VERSION}" \
            $prerelease \
            --notes "\`sgit\` ${VERSION}, built from a sealed repository.

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`
          " \
            dist/*
