services:
  portal:
    build:
      context: .
      dockerfile: infra/docker/portal/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./portal:/app
      - portal_node_modules:/app/node_modules
      - portal_next_cache:/app/.next
    command: npm run dev
    ports:
      - "${PORTAL_PORT:-3000}:3000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./portal:/app
      - ./cli:/cli
      - worker_node_modules:/app/node_modules
      - worker_work:/work
    command: npm run worker:dev

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  portal_node_modules:
  portal_next_cache:
  worker_node_modules: